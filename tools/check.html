<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>GLB roundtrip check</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #efe7d8;
      }
      canvas {
        display: block;
      }
      #info {
        position: fixed;
        top: 10px;
        left: 10px;
        font: 12px monospace;
        color: #333;
        background: #fffdf9cc;
        padding: 6px 10px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="info">loading…</div>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { FBXLoader } from 'three/addons/loaders/FBXLoader.js'
      import { OBJLoader } from 'three/addons/loaders/OBJLoader.js'

      const params = new URLSearchParams(location.search)
      const file = params.get('f') || '../preview/exports/mc-doll-slim.glb'
      const yaw = Number(params.get('yaw') || 0)
      const ext = file.split('.').pop().toLowerCase()

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      document.body.appendChild(renderer.domElement)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0xefe7d8)
      const camera = new THREE.PerspectiveCamera(26, window.innerWidth / window.innerHeight, 0.01, 100)
      scene.add(new THREE.HemisphereLight(0xffffff, 0x9c8f7c, 1.2))
      const key = new THREE.DirectionalLight(0xfff4e2, 2.2)
      key.position.set(-2, 4, -3)
      scene.add(key)

      const loader =
        ext === 'fbx' ? new FBXLoader() : ext === 'obj' ? new OBJLoader() : new GLTFLoader()
      loader.load(
        file,
        (result) => {
          const root = result.scene || result
          let meshes = 0
          let tris = 0
          root.traverse((c) => {
            if (!c.isMesh) return
            meshes += 1
            tris += (c.geometry.index ? c.geometry.index.count : c.geometry.attributes.position.count) / 3
            const maps = (Array.isArray(c.material) ? c.material : [c.material])
              .map((m) => (m?.map ? 'map' : 'no-map'))
              .join('/')
            if (meshes === 1) root.userData.probe = maps
          })
          root.rotation.y = yaw
          scene.add(root)

          window.__SCENE__ = scene
          const box = new THREE.Box3().setFromObject(root)
          const size = box.getSize(new THREE.Vector3())
          const center = box.getCenter(new THREE.Vector3())
          const radius = Math.max(size.x, size.y, size.z) * 0.62
          const distance = (radius / Math.tan((26 * Math.PI) / 360)) * 1.3
          camera.position.set(center.x, center.y + radius * 0.42, center.z - distance)
          camera.lookAt(center.x, center.y, center.z)
          const loop = () => {
            renderer.render(scene, camera)
            requestAnimationFrame(loop)
          }
          loop()
          document.getElementById('info').textContent =
            `${file.split('/').pop()} · ${meshes} mesh · ${Math.round(tris)} 面 · ${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)} · ${root.userData.probe || ''}`
        },
        undefined,
        (error) => {
          document.getElementById('info').textContent = 'LOAD FAIL: ' + error.message
        },
      )
    </script>
  </body>
</html>
